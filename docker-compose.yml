version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Container
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gqt_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: gqt_internships
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gqt_internships"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis Cache & Queue Container
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gqt_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Next.js 15 Backend & Frontend Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gqt_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword2026@postgres:5432/gqt_internships?schema=public"
      DIRECT_URL: "postgresql://postgres:postgrespassword2026@postgres:5432/gqt_internships?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "gqt_super_secret_enterprise_jwt_signing_key_2026_prod"
      JWT_REFRESH_SECRET: "gqt_super_secret_refresh_token_signing_key_2026_prod"
    ports:
      - "3000:3000"

  # ----------------------------------------------------------------------------
  # Prisma Studio Database Web Inspector
  # ----------------------------------------------------------------------------
  prisma-studio:
    image: node:22-alpine
    container_name: gqt_prisma_studio
    working_dir: /app
    volumes:
      - ./:/app
    command: npx prisma studio --port 5555 --hostname 0.0.0.0
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword2026@postgres:5432/gqt_internships?schema=public"
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
